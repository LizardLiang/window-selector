name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip leading 'v' to get bare version (e.g. v1.2.3 -> 1.2.3)
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify binary exists
        shell: bash
        run: |
          ls -lh target/x86_64-pc-windows-msvc/release/window-selector.exe

      # The installer is a required release artifact, so this step tries hard to
      # obtain NSIS before giving up: use a preinstalled copy if the runner image
      # has one, else Chocolatey (which ships on the image), else winget. Failing
      # the run is the last resort, not the first response to a flaky registry.
      - name: Install NSIS
        id: nsis
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $nsisDir = "C:\Program Files (x86)\NSIS"

          function Get-Makensis {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { return $cmd.Source }
            if (Test-Path "$nsisDir\makensis.exe") { return "$nsisDir\makensis.exe" }
            return $null
          }

          $makensis = Get-Makensis
          if ($makensis) {
            Write-Host "NSIS already present at $makensis; skipping install."
          } else {
            Write-Host "Installing NSIS via Chocolatey..."
            choco install nsis --no-progress -y
            $makensis = Get-Makensis
            if (-not $makensis) {
              Write-Host "Chocolatey did not yield makensis; falling back to winget."
              winget install NSIS.NSIS --silent --accept-package-agreements --accept-source-agreements
              $makensis = Get-Makensis
            }
          }

          if (-not $makensis) {
            Write-Host "::error::NSIS unavailable: makensis.exe not found after Chocolatey and winget."
            exit 1
          }

          # Put the install dir on PATH for later steps, then prove the binary
          # actually runs -- presence on disk is not the same as being usable.
          echo (Split-Path $makensis) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $makensis /VERSION
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::makensis found at $makensis but failed to run."
            exit 1
          }
          Write-Host "NSIS ready: $makensis"

      - name: Build NSIS installer
        id: installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # TARGET must match the --target used by the build step above.
          # installer.nsi defaults to the gnu triple from .cargo/config.toml
          # for local `make installer`, so CI has to override it explicitly.
          $target = "x86_64-pc-windows-msvc"
          $installerPath = "target\$target\release\WindowSelector-${env:VERSION}-setup.exe"
          & makensis /DVERSION=$env:VERSION /DTARGET=$target installer\installer.nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::makensis failed with exit code $LASTEXITCODE"
            exit 1
          }
          if (-not (Test-Path $installerPath)) {
            Write-Host "::error::makensis reported success but $installerPath is missing"
            exit 1
          }
          echo "path=${installerPath}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Installer built: $installerPath"

      - name: Stage release artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INSTALLER_PATH: ${{ steps.installer.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          cp target/x86_64-pc-windows-msvc/release/window-selector.exe \
             release-artifacts/window-selector-${VERSION}-x86_64.exe

          # Both artifacts are required; earlier steps fail the run if the
          # installer could not be produced, so a missing file here is a bug.
          cp "${INSTALLER_PATH}" \
             "release-artifacts/WindowSelector-${VERSION}-setup.exe"

          ls -lh release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Window Selector ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## Installation

            **With installer (recommended):**
            Download `WindowSelector-${{ steps.version.outputs.version }}-setup.exe` and run it.

            **Portable binary:**
            Download `window-selector-${{ steps.version.outputs.version }}-x86_64.exe` and place it anywhere you like.

            ## System Requirements
            - Windows 10 or 11 (64-bit)
            - No additional runtime required